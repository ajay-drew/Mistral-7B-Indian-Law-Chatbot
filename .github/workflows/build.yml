name: Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: mistral-law-api:latest
        cache-from: type=registry,ref=mistral-law-api:buildcache
        cache-to: type=registry,ref=mistral-law-api:buildcache,mode=max
    
    - name: Verify image
      run: |
        docker images | grep mistral-law-api
